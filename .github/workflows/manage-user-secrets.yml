name: Manage User Secrets

on:
  on:
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string

      direction:
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  manage-user-secrets:
    runs-on:
      group: VS-Provision
      labels:
        - self-hosted
        - Windows
        - VS-Provision

    environment: ${{ inputs.target_environment }}

    concurrency:
      group: user-secrets-${{ github.actor }}
      cancel-in-progress: false

    env:
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      DIRECTION: ${{ inputs.direction }}

      WEB_CSPROJ_PATH: ${{ vars.TEAMSAPP_CSPROJ }}
      ETL_CSPROJ_PATH: ${{ vars.ETL_CSPROJ }}

      USER_SECRET_JSON: ${{ secrets.USER_SECRETS_JSON }}
      ETL_USER_SECRET_JSON: ${{ secrets.ETL_USER_SECRETS_JSON }}

      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Manage User Secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Resolve-ProjectPath {
              param(
                  [string]$ProjectPath,
                  [string]$ProjectLabel
              )

              if ([string]::IsNullOrWhiteSpace($ProjectPath)) {
                  Write-Host "$ProjectLabel path not configured. Skipping."
                  return $null
              }

              if ([System.IO.Path]::IsPathRooted($ProjectPath)) {
                  throw "$ProjectLabel path must be relative to repository root: $ProjectPath"
              }

              $fullPath = Join-Path $env:GITHUB_WORKSPACE $ProjectPath

              if (-not (Test-Path $fullPath)) {
                  throw "$ProjectLabel project file not found: $fullPath"
              }

              if ([System.IO.Path]::GetExtension($fullPath) -ne ".csproj") {
                  throw "$ProjectLabel path must point to a .csproj file: $fullPath"
              }

              return $fullPath
          }

          function Get-UserSecretsFile {
              param(
                  [string]$ProjectFile,
                  [string]$ProjectLabel
              )

              if ([string]::IsNullOrWhiteSpace($ProjectFile)) {
                  return $null
              }

              [xml]$project = Get-Content $ProjectFile -Raw

              $userSecretsId = $project.Project.PropertyGroup.UserSecretsId |
                  Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
                  Select-Object -First 1

              if ([string]::IsNullOrWhiteSpace($userSecretsId)) {
                  throw "No UserSecretsId found in $ProjectLabel project: $ProjectFile"
              }

              $secretDirectory = Join-Path $env:APPDATA "Microsoft\UserSecrets\$userSecretsId"

              New-Item `
                  -ItemType Directory `
                  -Force `
                  -Path $secretDirectory | Out-Null

              return (Join-Path $secretDirectory "secrets.json")
          }

          function Pull-FromGitHub {
              param(
                  [string]$SecretsFile,
                  [string]$SecretJson,
                  [string]$ProjectLabel
              )

              if ([string]::IsNullOrWhiteSpace($SecretsFile)) {
                  return
              }

              if ([string]::IsNullOrWhiteSpace($SecretJson)) {
                  Write-Warning "$ProjectLabel GitHub secret is empty."
                  return
              }

              $null = $SecretJson | ConvertFrom-Json

              $SecretJson | Set-Content `
                  -Path $SecretsFile `
                  -Encoding UTF8

              Write-Host "Updated local secrets for $ProjectLabel"
          }

          function Push-ToGitHub {
              param(
                  [string]$SecretsFile,
                  [string]$SecretName,
                  [string]$ProjectLabel
              )

              if ([string]::IsNullOrWhiteSpace($SecretsFile)) {
                  return
              }

              if (-not (Test-Path $SecretsFile)) {
                  throw "$ProjectLabel secrets file not found: $SecretsFile"
              }

              $json = Get-Content $SecretsFile -Raw

              $null = $json | ConvertFrom-Json

              $json | gh secret set `
                  $SecretName `
                  --env $env:TARGET_ENVIRONMENT `
                  --repo $env:GITHUB_REPOSITORY

              Write-Host "Updated GitHub secret $SecretName from $ProjectLabel"
          }

          $webProject = Resolve-ProjectPath `
              -ProjectPath $env:WEB_CSPROJ_PATH `
              -ProjectLabel "Web App"

          $etlProject = Resolve-ProjectPath `
              -ProjectPath $env:ETL_CSPROJ_PATH `
              -ProjectLabel "ETL"

          $webSecretsFile = Get-UserSecretsFile `
              -ProjectFile $webProject `
              -ProjectLabel "Web App"

          $etlSecretsFile = Get-UserSecretsFile `
              -ProjectFile $etlProject `
              -ProjectLabel "ETL"

          switch ($env:DIRECTION) {

              "github-to-local" {

                  Pull-FromGitHub `
                      -SecretsFile $webSecretsFile `
                      -SecretJson $env:USER_SECRET_JSON `
                      -ProjectLabel "Web App"

                  Pull-FromGitHub `
                      -SecretsFile $etlSecretsFile `
                      -SecretJson $env:ETL_USER_SECRET_JSON `
                      -ProjectLabel "ETL"
              }

              "local-to-github" {

                  Push-ToGitHub `
                      -SecretsFile $webSecretsFile `
                      -SecretName "USER_SECRETS_JSON" `
                      -ProjectLabel "Web App"

                  Push-ToGitHub `
                      -SecretsFile $etlSecretsFile `
                      -SecretName "ETL_USER_SECRETS_JSON" `
                      -ProjectLabel "ETL"
              }

              default {
                  throw "Unsupported direction: $($env:DIRECTION)"
              }
          }
